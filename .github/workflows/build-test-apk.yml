name: Build Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-overwrite-existing: true

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug test APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Debug APK not found"
            find app/build/outputs/apk -type f -maxdepth 5 -print || true
            exit 1
          fi

          mkdir -p dist
          cp "$APK" "dist/ShizuLog-test-debug.apk"
          sha256sum "dist/ShizuLog-test-debug.apk" | tee "dist/ShizuLog-test-debug.apk.sha256"

      - name: Upload debug test APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ShizuLog-test-debug
          path: |
            dist/ShizuLog-test-debug.apk
            dist/ShizuLog-test-debug.apk.sha256
          if-no-files-found: error
          retention-days: 3
